name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install npm 12
        run: npm install --global --ignore-scripts npm@12.1.0
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build the game
        run: npm run build-prod
      - name: Render the page for static hosting
        env:
          GAME_ENV: prod
          GIT_COMMIT: ${{ github.sha }}
          DOMAIN: springveil.is-a.dev
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: npx tsx scripts/renderStaticIndex.ts
      - name: Assemble the site
        run: |
          # The game is the site root. Keep the custom domain and the older
          # pages published alongside it.
          cp CNAME static/CNAME
          cp -r "archive " static/archive
          cp -r theatresil static/theatresil
          # Single-page routes such as /game/<id> fall back to the game.
          cp static/index.html static/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
